name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release signing
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KS_B64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.CI_KEYSTORE_ALIAS }}
          KS_STORE_PW: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            cat > "$GITHUB_WORKSPACE/keystore.properties" <<PROPS
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=$KS_STORE_PW
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEY_PW
          PROPS
            echo "Release signing ready"
          else
            echo "No signing secrets — debug build"
          fi

      - name: Build release APK
        if: hashFiles('keystore.properties') != ''
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: hashFiles('keystore.properties') == ''
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload release APK
        if: hashFiles('keystore.properties') != ''
        uses: actions/upload-artifact@v4
        with:
          name: DayLoop-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        if: hashFiles('keystore.properties') == ''
        uses: actions/upload-artifact@v4
        with:
          name: DayLoop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
